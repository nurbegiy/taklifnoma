name: Keep Supabase Alive

on:
  schedule:
    # Har 3 kunda bir marta avtomatik ishlaydi
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Istalgan vaqtda GitHub'dan qo'lda ishga tushirish uchun

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"